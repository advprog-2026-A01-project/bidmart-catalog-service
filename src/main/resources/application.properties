# Server
server.port=${SERVER_PORT:8082}
spring.application.name=bidmart-catalog-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/catalog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:catalog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:catalog}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.connection-init-sql=SELECT 1

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Gateway Secret ? harus sama dengan yang dikonfigurasi di bidmart-api-gateway
app.gateway.secret=${GATEWAY_SECRET:local-dev-gateway-secret}

# gRPC Server
grpc.server.port=${GRPC_SERVER_PORT:9090}

# RabbitMQ Queue & Exchange names ? harus sama dengan yang dipakai auction-service
app.rabbitmq.exchange=bidmart.events
app.rabbitmq.queue.bid-placed=catalog.bid.placed
app.rabbitmq.queue.auction-closed=catalog.auction.closed
app.rabbitmq.routing-key.bid-placed=bid.placed
app.rabbitmq.routing-key.auction-closed=auction.closed

# Scheduler
app.scheduler.listing-close.fixed-delay-ms=60000

# Monitoring & Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=bidmart-catalog-service
management.endpoints.web.base-path=/api/monitoring
