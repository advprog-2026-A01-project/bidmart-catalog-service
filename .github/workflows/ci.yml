name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - staging
  pull_request:

jobs:
  build-and-test:
    name: Build, Test, and PMD
    runs-on: ubuntu-latest

#    services:
#      postgres:
#        image: postgres:16
#        env:
#          POSTGRES_DB: catalog_db
#          POSTGRES_USER: catalog
#          POSTGRES_PASSWORD: catalog
#        ports:
#          - 5435:5432
#        options: >-
#          --health-cmd pg_isready
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5
#
#    env:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5435/catalog_db
#      SPRING_DATASOURCE_USERNAME: catalog
#      SPRING_DATASOURCE_PASSWORD: catalog
#      SPRING_RABBITMQ_HOST: localhost
#      SPRING_RABBITMQ_PORT: 5672
#      SPRING_RABBITMQ_USERNAME: guest
#      SPRING_RABBITMQ_PASSWORD: guest
#      GATEWAY_SECRET: ci-gateway-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Run PMD
        run: ./gradlew pmdMain pmdTest

      - name: Upload PMD reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: build/reports/pmd/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
